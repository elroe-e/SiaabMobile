name: Deploy to cPanel

# Every push to main builds the site and uploads it to the cPanel Node.js app over FTPS.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cpanel
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy settings
        id: ready
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        run: |
          # Until the secrets are added, skip quietly instead of failing every push.
          if [ -z "$FTP_SERVER" ] || [ -z "$SUPABASE_URL" ]; then
            echo "Add FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY as repository secrets to turn on deploys."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.ready.outputs.go == 'true'

      - uses: actions/setup-node@v4
        if: steps.ready.outputs.go == 'true'
        with:
          node-version: 20
          cache: npm

      - name: Build the self-contained site
        if: steps.ready.outputs.go == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://siaabmobile.com' }}
        run: |
          npm ci
          node scripts/package-cpanel.mjs
          # cPanel restarts the Node.js app whenever tmp/restart.txt changes.
          mkdir -p .next/standalone/tmp
          date -u > .next/standalone/tmp/restart.txt

      - name: Upload to cPanel
        if: steps.ready.outputs.go == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./.next/standalone/
          server-dir: ./
          # The default exclude list drops node_modules, but the standalone server needs its trimmed copy.
          exclude: |
            **/.git*
            **/.git*/**
